name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  release:
    name: Build web bundle and create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config xz-utils \
            libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run full check
        run: scripts/volledige-check.sh

      - name: Build 3D board WASM and production web bundle
        run: |
          npm --prefix web run wasm3d
          npm --prefix web run build
          scripts/uitrol-controle.sh web/dist

      - name: Package release archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-artifacts
          tar -czf "release-artifacts/leapstone-web-${TAG}.tar.gz" -C web/dist .
          (cd release-artifacts && sha256sum "leapstone-web-${TAG}.tar.gz" > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease_flag=""
          if [[ "$TAG" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "$TAG" \
            "release-artifacts/leapstone-web-${TAG}.tar.gz" \
            "release-artifacts/SHA256SUMS.txt" \
            --title "Leapstone ${TAG}" \
            --generate-notes \
            $prerelease_flag
